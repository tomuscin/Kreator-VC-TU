services:
  - type: web
    name: kreator-vc-tu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # wpisz ręcznie w Render dashboard
      - key: OPENAI_MODEL_PRIMARY
        value: gpt-5.5
      - key: OPENAI_MODEL_FALLBACK
        value: gpt-5.4
      - key: OPENAI_MODEL_MINI
        value: gpt-5.4-mini
      - key: SMTP_HOST
        value: mail.tomaszuscinski.pl
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false          # uscinski.tomek@gmail.com — wpisz ręcznie
      - key: SMTP_PASSWORD
        sync: false          # Gmail App Password (16 znaków) — wpisz ręcznie
      - key: SMTP_FROM
        value: uscinski.tomek@gmail.com
      - key: SMTP_FROM_NAME
        value: "Tomasz Uściński"
      - key: APP_USERNAME
        sync: false          # login do Basic Auth
      - key: APP_PASSWORD
        sync: false          # hasło do Basic Auth
