services:
  - type: web
    name: kreator-vc-tu
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: OPENAI_API_KEY
        sync: false          # wpisz ręcznie w Render dashboard
      - key: OPENAI_MODEL_PRIMARY
        value: gpt-4.1
      - key: OPENAI_MODEL_FALLBACK
        value: gpt-4.1-mini
      - key: OPENAI_MODEL_MINI
        value: gpt-4.1-mini
      - key: SMTP_HOST
        value: mail.tomaszuscinski.pl
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: tomasz@tomaszuscinski.pl
      - key: SMTP_PASSWORD
        sync: false          # hasło do poczty WEBD — wpisz ręcznie
      - key: SMTP_FROM
        value: tomasz@tomaszuscinski.pl
      - key: SMTP_FROM_NAME
        value: "Tomasz Uściński"
      - key: APP_USERNAME
        sync: false          # login do Basic Auth
      - key: APP_PASSWORD
        sync: false          # hasło do Basic Auth
      - key: DB_ENABLED
        value: "true"
      - key: DB_HOST
        value: mn05.webd.pl
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: tomuscin_cv_tomasz
      - key: DB_USER
        value: tomuscin_tomuscin
      - key: DB_PASSWORD
        sync: false          # hasło MySQL — wpisz ręcznie w Render dashboard
